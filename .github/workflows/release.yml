name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Unit tests
        run: zig build test

      - name: Build (Windows x86_64, ReleaseFast; SDL3 is compiled in statically)
        run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-windows-gnu

      - name: Package
        run: |
          short=$(git rev-parse --short HEAD)
          echo "VERSION=build-${{ github.run_number }}-$short" >> "$GITHUB_ENV"
          (cd zig-out/bin && zip -9 "$GITHUB_WORKSPACE/DanceTeachersPet-windows-x64.zip" DanceTeachersPet.exe)

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: DanceTeachersPet-windows-x64
          path: DanceTeachersPet-windows-x64.zip

      - name: Create release
        if: github.event_name == 'push'
        run: >
          gh release create "$VERSION" DanceTeachersPet-windows-x64.zip
          --target "$GITHUB_SHA"
          --title "Dance Teacher’s Pet $VERSION"
          --generate-notes
